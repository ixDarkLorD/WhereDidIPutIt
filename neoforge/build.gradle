apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/neoforge.gradle"

// Refined Storage is published to its own Maven, which the shared scripts don't list.
repositories {
    maven {
        name = "Refined Mods"
        url = "https://maven.creeperhost.net/"
        content { includeGroup "com.refinedmods.refinedstorage" }
    }
}

dependencies {
    // CoolCatLib (NeoForge). Its common classes are inside this jar.
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-neoforge:${coolcatlib_version}") { transitive = false }

    // Recipe viewers in a dev run only when asked (-Ptest_jei=true, -Ptest_rei=true), to try the find key on their entries.
    if (project.findProperty("test_jei") == "true") modLocalRuntime libs.jei.neoforge
    if (project.findProperty("test_rei") == "true") modLocalRuntime libs.rei.neoforge
    if (project.findProperty("test_jade") == "true") modLocalRuntime("maven.modrinth:jade:${jade_version}+neoforge") { transitive = false }

    // Optional storage mods whose terminal readers live here (compat/): AE2 and Simple Storage Network are NeoForge
    // only, and Tom's has a jar per loader. -Ptest_<mod>=true runs them.
    modCompileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    modCompileOnly("maven.modrinth:simple-storage-network:${storage_network_version}") { transitive = false }
    modCompileOnly("maven.modrinth:toms-storage:${toms_storage_version}") { transitive = false }
    if (project.findProperty("test_ae2") == "true") modLocalRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    if (project.findProperty("test_ssn") == "true") {
        modLocalRuntime("maven.modrinth:simple-storage-network:${storage_network_version}") { transitive = false }
        modLocalRuntime("maven.modrinth:flib:${flib_version}") { transitive = false }
    }
    if (project.findProperty("test_toms") == "true") modLocalRuntime("maven.modrinth:toms-storage:${toms_storage_version}") { transitive = false }
    if (project.findProperty("test_rs") == "true") modLocalRuntime "com.refinedmods.refinedstorage:refinedstorage-neoforge:${refined_storage_version}"
}
