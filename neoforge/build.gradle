apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/neoforge.gradle"

dependencies {
    // CoolCatLib (NeoForge). Its common classes are inside this jar.
    implementation "net.ixdarklord.coolcatlib:coolcatlib-neoforge:${coolcatlib_version}"

    // Dev runs only, never published: MCP Bridge lets the game be driven from outside. Not transitive, because it still points
    // at CoolCatLib's old coordinates and would load a second copy of it.
    localRuntime("net.ixdarklord.mcp_bridge:mcp_bridge-neoforge:${mcp_bridge_version}") { transitive = false }

    // Glazed Menu, to open the config screens in a dev run, only when asked (-Ptest_glazed=true).
    if (project.findProperty("test_glazed") == "true") localRuntime("net.ixdarklord.glazedmenu:glazedmenu-neoforge:${glazedmenu_version}") { transitive = false }

    // Recipe viewers in a dev run only when asked (-Ptest_jei=true, -Ptest_rei=true), to try the find key on their entries.
    if (project.findProperty("test_jei") == "true") localRuntime "mezz.jei:jei-26.3-neoforge:${jei_version}"
    if (project.findProperty("test_rei") == "true") localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    if (project.findProperty("test_jade") == "true") localRuntime("maven.modrinth:jade:${jade_version}") { transitive = false }

    // Optional storage mods whose terminal readers live here (compat/): AE2 is NeoForge only, and Tom's has a jar per
    // loader. -Ptest_<mod>=true runs them.
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    compileOnly("maven.modrinth:toms-storage:${toms_storage_version}") { transitive = false }
    if (project.findProperty("test_ae2") == "true") localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    if (project.findProperty("test_toms") == "true") localRuntime("maven.modrinth:toms-storage:${toms_storage_version}") { transitive = false }
}

// Simple Storage Network has no 26.3 build: its readers stay in the source but out of this build.
sourceSets.main.java.exclude "net/ixdarklord/wheredidiputit/neoforge/compat/StorageNetwork*.java"
