apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/forge.gradle"

dependencies {
    // CoolCatLib (Forge). Its common classes are inside this jar.
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-forge:${coolcatlib_version}") { transitive = false }

    // JEI in a dev run only when asked (-Ptest_jei=true), to try the find key on its entries. No storage mod the mod
    // reads has a Forge build for 1.21.1.
    if (project.findProperty("test_jei") == "true") modLocalRuntime "mezz.jei:jei-1.21.1-forge:${libs.versions.jei.get()}"
}
