apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/fabric.gradle"

dependencies {
    // CoolCatLib (Fabric). Its common classes are inside this jar.
    modImplementation "net.ixdarklord.coolcatlib:coolcatlib-fabric:${libs.versions.minecraft.get()}-${coolcatlib_version}"

    // Recipe viewers in a dev run only when asked (-Ptest_jei=true, -Ptest_rei=true), to try the find key on their entries.
    if (project.findProperty("test_jei") == "true") modLocalRuntime libs.jei.fabric
    if (project.findProperty("test_rei") == "true") modLocalRuntime libs.rei.fabric

    // Optional storage mods whose terminal readers live here (compat/), the jars Fabric has. -Ptest_<mod>=true runs them.
    modCompileOnly("appeng:appliedenergistics2-fabric:${ae2_version}") { transitive = false }
    // AE2's block entities implement interfaces of Fabric API's deprecated modules, which the shared script leaves out.
    modCompileOnly "net.fabricmc.fabric-api:fabric-api-deprecated:${libs.versions.fabricapi.version.get()}"
    modCompileOnly("maven.modrinth:toms-storage:${toms_storage_fabric_version}") { transitive = false }
    if (project.findProperty("test_ae2") == "true") {
        modLocalRuntime("appeng:appliedenergistics2-fabric:${ae2_version}") { transitive = false }
        modLocalRuntime "net.fabricmc.fabric-api:fabric-api-deprecated:${libs.versions.fabricapi.version.get()}"
        // Team Reborn's Energy API, which AE2's jar nests and dev runs don't load from there.
        modLocalRuntime("teamreborn:energy:3.0.0") { transitive = false }
    }
    if (project.findProperty("test_toms") == "true") {
        modLocalRuntime("maven.modrinth:toms-storage:${toms_storage_fabric_version}") { transitive = false }
        modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") { exclude group: "net.fabricmc.fabric-api" }
    }
}

// A dev run straight into a singleplayer world of run/saves when asked (-Ptest_world="<world folder>"), to test without
// clicking through the menus.
if (project.findProperty("test_world") != null) {
    loom.runs.client.programArgs("--quickPlaySingleplayer", project.findProperty("test_world").toString())
}
