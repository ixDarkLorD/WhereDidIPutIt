apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/fabric.gradle"

// Refined Storage is published to its own Maven, which the shared scripts don't list.
repositories {
    maven {
        name = "Refined Mods"
        url = "https://maven.creeperhost.net/"
        content { includeGroup "com.refinedmods.refinedstorage" }
    }
}

// Fabric API 0.116.5+1.21.1 publishes fabric-loot-api-v2 with dependencies on modules of a newer Minecraft
// (fabric-resource-loader-v0 2.0.0, fabric-api-base 0.4.43), which Gradle then picks over the ones the API itself
// ships, and a dev run then fails to load (as in FTB Ultimine Addition). Those two are dropped from that module: the
// API brings its own. Jars are not affected.
dependencies.components.withModule("net.fabricmc.fabric-api:fabric-loot-api-v2") {
    allVariants {
        withDependencies { deps -> deps.removeAll { it.name in ["fabric-resource-loader-v0", "fabric-api-base"] } }
    }
}

dependencies {
    // CoolCatLib (Fabric). Its common classes are inside this jar.
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-fabric:${coolcatlib_version}") { transitive = false }

    // Recipe viewers in a dev run only when asked (-Ptest_jei=true, -Ptest_rei=true), to try the find key on their entries.
    if (project.findProperty("test_jei") == "true") modLocalRuntime libs.jei.fabric
    if (project.findProperty("test_rei") == "true") modLocalRuntime libs.rei.fabric

    // Optional storage mods whose terminal readers live here (compat/), the jars Fabric has. -Ptest_<mod>=true runs them.
    modCompileOnly("maven.modrinth:toms-storage:${toms_storage_fabric_version}") { transitive = false }
    if (project.findProperty("test_toms") == "true") modLocalRuntime("maven.modrinth:toms-storage:${toms_storage_fabric_version}") { transitive = false }
    if (project.findProperty("test_rs") == "true") modLocalRuntime "com.refinedmods.refinedstorage:refinedstorage-fabric:${refined_storage_version}"
}
