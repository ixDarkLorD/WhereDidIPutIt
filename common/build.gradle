apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/common.gradle"

// Refined Storage has no 26.2 build: its readers (compat/refinedstorage) stay in the source, out of this build, until
// it has one.
sourceSets.main.java.exclude "net/ixdarklord/wheredidiputit/compat/refinedstorage/**"

dependencies {
    // CoolCatLib (common): mod constructors, events, networking, configs, attachments, platform checks
    compileOnly "net.ixdarklord.coolcatlib:coolcatlib-common:${coolcatlib_version}"

    // Optional recipe viewers: the find key reads the entry under the mouse (compat/jei, compat/rei)
    compileOnly "mezz.jei:jei-26.2-common-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
}

// The shared main.gradle publishes every subproject's shadowJar. For common it must be a plain jar of this
// module's own classes (Shadow's default bundles the whole runtime classpath under an "-all" classifier).
shadowJar {
    configurations = []
    archiveClassifier = null
}
