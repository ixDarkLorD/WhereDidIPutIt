apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/common.gradle"

dependencies {
    // CoolCatLib (common): mod constructors, events, networking, configs, platform checks, world effects
    modCompileOnly "net.ixdarklord.coolcatlib:coolcatlib-common:${coolcatlib_version}"

    // Optional recipe viewers: the find key reads the entry under the mouse (compat/jei, compat/rei)
    modCompileOnly libs.jei.api.common
    modCompileOnly libs.rei.api.common

    // Optional Jade: the compass keeps clear of its box (compat/jade). Its API classes are the same in both loaders' jars.
    modCompileOnly("maven.modrinth:jade:${jade_version}+fabric") { transitive = false }
}

// The shared main.gradle publishes every subproject's shadowJar. For common it must be a plain jar of this
// module's own classes (Shadow's default bundles the whole runtime classpath under an "-all" classifier).
shadowJar {
    configurations = []
    archiveClassifier = null
}
