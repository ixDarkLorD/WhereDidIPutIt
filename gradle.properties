# ─── Gradle ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Build ──────────────────────────────────────────────────────────────────────────────────────────────────────────
# The shared version catalog (net.ixdarklord:sharedcatalogs) and the loaders the mod is built for.
dependencies_catalog_version=1.21.1-v10
project_loaders=forge,fabric,neoforge
project_game_versions=1.21.1
# The oldest versions the jars accept (the metadata templates read them); the same as CoolCatLib's.
supported_min_mc_version=1.21.1
supported_min_neoforge_version=21.1.200
supported_min_forge_version=52.1.0
supported_min_fabric_api_version=0.116.5

# ─── Dev Runs ───────────────────────────────────────────────────────────────────────────────────────────────────────
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# ─── Where Did I Put It? ────────────────────────────────────────────────────────────────────────────────────────────
# A plain build number, like CoolCatLib's: versions read <minecraft>-<mod version>, e.g. 1.21.1-1.
mod_version=1.1.0
modid=wheredidiputit
# Maven artifacts: net.ixdarklord.wheredidiputit:<mod_maven_name>-<loader>
mod_maven_name=wheredidiputit
mod_name=Where Did I Put It?
mod_description=Hover an item, press a key, and the nearest container holding it lights up. Remembers what's in every chest you open.
mod_author=ixDarkLorD
mod_license=MPL-2.0
mod_maven_group=net.ixdarklord
mod_source_url=https://github.com/ixDarkLorD/WhereDidIPutIt
mod_issue_url=https://github.com/ixDarkLorD/WhereDidIPutIt/issues
mod_page_url=https://modrinth.com/mod/where-did-i-put-it
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/wheredidiputit.json
mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/neoforge/wheredidiputit.json
mod_fabric_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/fabric/wheredidiputit.json
# Loaded on both sides but needed only on the client: memory mode works on any server, and a server with the mod
# adds live search.
mod_environment=*
# (Forge) IGNORE_ALL_VERSION: neither side needs the other to have the mod.
mod_forge_display_test=IGNORE_ALL_VERSION

# ─── Publishing ─────────────────────────────────────────────────────────────────────────────────────────────────────
project_release_type=release
# true uploads nothing, only shows what would be published. Stays true until the first release.
project_upload_debug=false
# Copies each built loader jar to build_jar_output_dir (set in the user's gradle.properties)
copy_build_jar=true
project_curse_id=1757131
project_modrinth_id=mWq0KQyW
# Dependencies of the uploaded files, by CurseForge/Modrinth slug: requirement[a,b],optional[c]
forge_publish_dependencies=requirement[coolcatlib],optional[jei]
fabric_publish_dependencies=requirement[coolcatlib,fabric-api],optional[jei]
neoforge_publish_dependencies=requirement[coolcatlib],optional[jei]

# ─── Dependencies ───────────────────────────────────────────────────────────────────────────────────────────────────
# CoolCatLib (required), from mavenLocal (published from ../CoolCatLib-1.21): the Maven version, and the oldest mod
# version the jars accept. MCP Bridge and Glazed Menu have no 1.21.1 build.
coolcatlib_version=8.0.0+1.21.1
coolcatlib_min_version=8.0.0
# Recipe viewers, optional (compileOnly; the find key works on their entries when installed): JEI and REI come from the
# catalog (jei, rei). Added to dev runs only when asked: -Ptest_jei=true or -Ptest_rei=true (REI: Fabric and NeoForge).
# Storage mods, optional (compileOnly): their terminals are remembered with what their networks hold. AE2 from Maven
# Central, Refined Storage from maven.creeperhost.net, Simple Storage Network and Tom's from the Modrinth Maven. AE2 and
# SSN exist for NeoForge only, Refined Storage and Tom's for NeoForge and Fabric: none has a Forge build for 1.21.1.
# Added to dev runs only when asked: -Ptest_ae2, -Ptest_rs, -Ptest_ssn, -Ptest_toms=true.
ae2_version=19.2.17
refined_storage_version=2.0.9
storage_network_version=1.21.1-1.13.2
# The library Simple Storage Network needs, for its test runs only.
flib_version=1.21.1-0.2.9
toms_storage_version=1.21-2.4.2
toms_storage_fabric_version=1.21-2.4.2-fabric
