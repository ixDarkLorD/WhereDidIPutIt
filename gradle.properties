# ─── Gradle ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Build ──────────────────────────────────────────────────────────────────────────────────────────────────────────
# The shared version catalog (net.ixdarklord:sharedcatalogs) and the loaders the mod is built for.
dependencies_catalog_version=1.20.1-v9
project_loaders=fabric,forge
project_game_versions=1.20.1
project_java_version=17

# ─── Dev Runs ───────────────────────────────────────────────────────────────────────────────────────────────────────
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# ─── Where Did I Put It? ────────────────────────────────────────────────────────────────────────────────────────────
# Major.minor from 1.1 on (author, 2026-10-23): versions read <minecraft>-<mod version>, e.g. 26.1.2-1.1.
mod_version=1.1.0
modid=wheredidiputit
# Maven artifacts: net.ixdarklord.wheredidiputit:<mod_maven_name>-<loader>
mod_maven_name=wheredidiputit
mod_name=Where Did I Put It?
mod_description=Hover an item, press a key, and the nearest container holding it lights up. Remembers what's in every chest you open.
mod_author=ixDarkLorD
mod_license=MPL-2.0
mod_maven_group=net.ixdarklord
mod_source_url=https://github.com/ixDarkLorD/WhereDidIPutIt
mod_issue_url=https://github.com/ixDarkLorD/WhereDidIPutIt/issues
mod_page_url=https://modrinth.com/mod/where-did-i-put-it
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/wheredidiputit.json
mod_fabric_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/fabric/wheredidiputit.json
# Loaded on both sides but needed only on the client: memory mode works on any server, and a server with the mod
# adds live search.
mod_environment=*
# (Forge) MATCH_VERSION: both sides need the mod (author, 2026-10-22).
mod_forge_display_test=MATCH_VERSION

# ─── Publishing ─────────────────────────────────────────────────────────────────────────────────────────────────────
project_release_type=release
# true uploads nothing, only shows what would be published. Stays true until the first release.
project_upload_debug=false
# Copies each built loader jar to build_jar_output_dir (set in the user's gradle.properties)
copy_build_jar=true
project_curse_id=1757131
project_modrinth_id=mWq0KQyW
# Dependencies of the uploaded files, by CurseForge/Modrinth slug: requirement[a,b],optional[c]
fabric_publish_dependencies=requirement[coolcatlib,fabric-api],optional[jei]
forge_publish_dependencies=requirement[coolcatlib],optional[jei]

# ─── Dependencies ───────────────────────────────────────────────────────────────────────────────────────────────────
# CoolCatLib (required) is not in the catalog; it comes from mavenLocal (published from ../CoolCatLib-1.20.1) as
# coolcatlib-<loader>:1.20.1-<this version>. MCP Bridge has no 1.20.1 build.
coolcatlib_version=8.0.0+1.20.1
# Recipe viewers, optional (compileOnly; the find key works on their entries when installed): JEI and REI come from the
# catalog. EMI isn't supported. Added to dev runs only when asked: -Ptest_jei=true or -Ptest_rei=true.
# Jade, optional (compileOnly, from the Modrinth Maven as jade:<this>+fabric / +forge; common compiles against the Fabric
# jar, whose API is the same): the compass keeps clear of its box. Added to Forge dev runs only when asked: -Ptest_jade=true.
jade_version=11.13.3
# Storage mods, optional (compileOnly): their terminals are remembered with what their networks hold. AE2 from ModMaven
# (both loaders), Refined Storage 1.x, Simple Storage Network and Tom's from the Modrinth Maven. Refined Storage and SSN
# exist for Forge only on 1.20.1. Added to dev runs only when asked: -Ptest_ae2, -Ptest_rs, -Ptest_ssn, -Ptest_toms=true.
ae2_version=15.4.11
refined_storage_version=1.12.4
storage_network_version=1.20.1-1.13.2
toms_storage_version=1.20-1.7.1
toms_storage_fabric_version=1.20-1.7.1-fabric
# Libraries the storage mods need, for their test runs only: GuideME for AE2 on Forge (a Modrinth version id, as its
# version number is shared with other loaders), flib for Simple Storage Network.
guideme_version=i7Tp1AHw
flib_version=1.20.1-0.0.16
# Cloth Config for Tom's on Fabric in dev runs: its jar nests it, which dev runs don't load.
cloth_config_version=11.1.136
